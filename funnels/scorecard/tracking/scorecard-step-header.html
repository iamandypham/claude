<!-- BG scorecard step header tracking (2026-11-08)
     Copied from the VSL step header: fbclid stamp, AEO JSON-LD, delayed Clarity.
     Whop Lead fires once per quiz lead on the page's own "bg:scorecard-lead" event.
     Test leads (@example.com email or ?bgtest=1) never fire it. -->

<!-- 1) fbclid — must stay early for ads attribution -->
<script>
(function () {
  try {
    var m = String(location.href || '').match(/[?&]fbclid=([^&#]+)/);
    var v = m ? decodeURIComponent(m[1]) : '';
    if (!v) return;
    try { sessionStorage.setItem('bg_fbclid', v); } catch (e) {}
    document.cookie = 'bg_fbclid=' + encodeURIComponent(v) + ';path=/;max-age=604800;SameSite=Lax';
  } catch (e) {}
})();
</script>

<!-- 2) Whop Lead when the quiz saves a lead (skipped for test leads) -->
<script>
(function () {
  if (window.__bgScWhopLead) return;
  window.__bgScWhopLead = 1;
  window.addEventListener('bg:scorecard-lead', function (ev) {
    var d = (ev && ev.detail) || {};
    if (d.test) return;
    try { if (sessionStorage.getItem('whop_lead_sc')) return; } catch (e) {}
    var payload = { event_id: 'lead_sc_' + (d.lead_id || Date.now().toString(36)) };
    var sent = false;
    try {
      if (window.whop && typeof whop.scope === 'function') {
        whop.scope('biz_0PFOl9w41XrCmJ').track('lead', payload);
        sent = true;
      } else if (window.whop && typeof whop.track === 'function') {
        whop.track('lead', payload);
        sent = true;
      }
    } catch (e) {}
    if (sent) { try { sessionStorage.setItem('whop_lead_sc', '1'); } catch (e) {} }
  });
})();
</script>

<!-- 4) Clarity — DELAYED until after load + idle. -->
<script>
(function () {
  function bootClarity() {
    if (window.__bgClarityBooted) return;
    window.__bgClarityBooted = true;
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
      t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, 'clarity', 'script', 'yhncnzon2c');
  }
  function later(fn) {
    var idle = window.requestIdleCallback || function (cb) { setTimeout(cb, 1); };
    idle(fn, { timeout: 2500 });
  }
  if (document.readyState === 'complete') later(bootClarity);
  else window.addEventListener('load', function () { later(bootClarity); }, { once: true });
})();
</script>
